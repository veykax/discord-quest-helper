name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Build Binaries
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME:-manual}

          # Windows amd64 (GUI subsystem, embedded icon)
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o dist/discord-quest-helper.exe

          # Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/discord-quest-helper-linux
          chmod +x dist/discord-quest-helper-linux

          # Packaging archives
          cd dist
          zip -9 discord-quest-helper-windows-amd64.zip discord-quest-helper.exe ../README.md ../LICENSE
          tar -czf discord-quest-helper-linux-amd64.tar.gz discord-quest-helper-linux ../README.md ../LICENSE
          
          # Checksums
          sha256sum discord-quest-helper.exe discord-quest-helper-linux discord-quest-helper-windows-amd64.zip discord-quest-helper-linux-amd64.tar.gz > checksums.txt
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discord-quest-helper-binaries
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/discord-quest-helper.exe
            dist/discord-quest-helper-linux
            dist/discord-quest-helper-windows-amd64.zip
            dist/discord-quest-helper-linux-amd64.tar.gz
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
