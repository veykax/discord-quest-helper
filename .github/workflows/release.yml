name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multiplatform Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Build Windows Executable
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H windowsgui" -o dist/discord-quest-helper.exe

      - name: Build Linux Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/discord-quest-helper-linux
          chmod +x dist/discord-quest-helper-linux

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discord-quest-helper-binaries
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/discord-quest-helper.exe
            dist/discord-quest-helper-linux
          draft: false
          prerelease: false
          generate_release_notes: true
