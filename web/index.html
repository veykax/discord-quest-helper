<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Quest Helper</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1f22">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=gg+sans:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-logo" id="brandLogo" title="Discord Quest Helper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C7 2 4 5.5 4 10.5V19.5L6.5 18L9.5 19.5L12 18L14.5 19.5L17.5 18L20 19.5V10.5C20 5.5 17 2 12 2Z" fill="#FFFFFF"/>
            <circle cx="9" cy="9.5" r="1.8" fill="#5865F2"/>
            <circle cx="15" cy="9.5" r="1.8" fill="#5865F2"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Discord Quest Helper</h1>
        </div>
      </div>
      <div class="header-actions">
        <!-- Update notification button -->
        <button type="button" class="header-link-btn update-btn hidden" id="updateBtn" title="New version available">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span id="updateBtnText">Update</span>
        </button>

        <!-- Direct Discord link -->
        <button type="button" class="header-link-btn" id="openDiscordHeaderBtn" title="Open Discord Quests">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          <span id="openDiscordBtnText">Open Discord</span>
        </button>

        <button class="icon-btn" id="soundToggleBtn" title="Completion sound">
          <svg id="soundOnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="soundOffIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <button class="lang-btn" id="langToggleBtn" title="Switch Language">EN</button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-content">
      <!-- Left Column: Process List -->
      <section class="left-panel">
        <div class="panel-header">
          <div class="panel-title-row">
            <h2 id="questProcessesHeading">Processes</h2>
            <span class="items-count" id="gamesCount">0</span>
            <span class="quest-summary-pill hidden" id="questSummaryPill"></span>
          </div>
          <div class="search-bar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="Search game or .exe...">
          </div>
        </div>

        <!-- Games List -->
        <div class="games-list" id="gamesList"></div>

        <!-- Custom Process Card -->
        <div class="custom-game-card">
          <div class="custom-card-header">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            <span id="customProcessHeading">Custom Process</span>
          </div>
          <div class="custom-inputs">
            <input type="text" id="customExeInput" placeholder="game.exe">
            <input type="text" id="customTitleInput" placeholder="Game Title">
            <button class="btn btn-secondary btn-sm" id="customSelectBtn">Add</button>
          </div>
        </div>
      </section>

      <!-- Right Column: Status & Timer -->
      <section class="right-panel">
        <!-- Selected Game Card -->
        <div class="active-game-card">
          <div class="active-game-info">
            <div class="active-title-row">
              <h3 id="selectedGameTitle">Roblox</h3>
              <span class="quest-status-inline hidden" id="selectedGameQuestTag"></span>
            </div>
            <div class="active-meta-row">
              <span class="process-tag" id="selectedGameExe">RobloxPlayerBeta.exe</span>
              <span class="active-hint" id="selectedGameHint"></span>
            </div>
          </div>
          <div class="active-game-status">
            <span class="status-indicator" id="statusBadge">
              <span class="status-dot"></span>
              <span id="statusText">Idle</span>
            </span>
          </div>
        </div>

        <!-- Circular Timer -->
        <div class="timer-card">
          <div class="circular-progress">
            <svg viewBox="0 0 180 180" class="progress-ring" shape-rendering="geometricPrecision">
              <circle class="ring-bg" cx="90" cy="90" r="76" shape-rendering="geometricPrecision" />
              <circle class="ring-fill" id="ringFill" cx="90" cy="90" r="76" shape-rendering="geometricPrecision" />
            </svg>
            <div class="timer-center">
              <span class="timer-digits" id="timerDigits">15:15</span>
            </div>
          </div>
          <div class="timer-caption" id="timerCaption">
            Select a process and start emulation
          </div>
        </div>

        <!-- Controls -->
        <div class="controls-row">
          <button class="btn btn-primary" id="startBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span id="startBtnText">Start (15 min)</span>
          </button>
          <button class="btn btn-secondary" id="stopBtn" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
              <rect x="4" y="4" width="16" height="16" rx="2"></rect>
            </svg>
            <span id="stopBtnText">Stop</span>
          </button>
        </div>

        <!-- Automation Card (Auto-Queue) -->
        <div class="automation-card">
          <label class="toggle-row" title="Automatically start the next active quest when the current one finishes">
            <div class="toggle-info">
              <div class="toggle-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="8" y1="6" x2="21" y2="6"></line>
                  <line x1="8" y1="12" x2="21" y2="12"></line>
                  <line x1="8" y1="18" x2="21" y2="18"></line>
                  <line x1="3" y1="6" x2="3.01" y2="6"></line>
                  <line x1="3" y1="12" x2="3.01" y2="12"></line>
                  <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
              </div>
              <div class="toggle-text-block">
                <span class="toggle-label" id="autoQueueText">Auto-Queue active quests</span>
                <span class="toggle-desc" id="autoQueueDesc">Runs accepted quests sequentially</span>
              </div>
            </div>
            <div class="switch">
              <input type="checkbox" id="autoQueueCheckbox">
              <span class="switch-slider"></span>
            </div>
          </label>
        </div>

        <!-- Clean Service Footer -->
        <div class="service-footer">
          <div class="footer-left">
            <span class="version-tag">v1.0.5</span>
          </div>
          <div class="cache-status">
            <span class="cache-dot" id="cacheDot"></span>
            <span id="cacheTimeText">Discord cache synced</span>
          </div>
        </div>
      </section>
    </main>

    <!-- Toast Notification -->
    <div class="toast hidden" id="toast">
      <div class="toast-body">
        <div class="toast-title" id="toastTitle">Notification</div>
        <div class="toast-msg" id="toastMsg"></div>
      </div>
      <button class="toast-close" id="toastCloseBtn">&times;</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
